server:
  port: 8081

spring:
  application:
    name: scrapper
  grpc:
    server:
      port: 9091
      servlet:
        enabled: false
    client:
      channels:
        bot:
          address: ${app.bot.grpc-address}
  config:
    import:
      - optional:file:.env.properties
      - optional:file:scrapper/.env.properties
      - optional:file:.env[.properties]
      - optional:file:scrapper/.env[.properties]

app:
  stackoverflow:
    base-url: https://api.stackexchange.com/2.3
    key: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
    access-token: ${STACKOVERFLOW_ACCESS_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
    site: stackoverflow
  github:
    token: ${GITHUB_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    base-url: https://api.github.com
  scheduler:
    link-check-delay-ms: 60s
  bot:
    transport: http
    base-url: http://localhost:8080
    grpc-address: localhost:9090

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} level=%-5level logger=%logger{36} msg=\"%msg\" %kvp %mdc%n"
