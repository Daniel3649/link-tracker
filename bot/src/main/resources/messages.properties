command.start=Hi! I am LinkTracker Bot. Use /help to see all commands.
command.start.description=start the bot and show a welcome message

command.unknown=Unknown command. Use /help to see available commands.

command.help.header=Available commands:
command.help.description=show the list of available commands

command.track=After sending link, you must track it. \n\nSupported by: \n- GitHub repository \n- StackOverflow question\n\nTo cancel, enter /cancel
command.track.description=start adding a link

command.cancel.description=cancel the current add link dialog
command.cancel=current dialogue canceled
command.cancel.dialog-not-found=There is no active dialogue at the moment.

link.accept.success=The link has been accepted. \nNow send the tags, separated by commas. \n\nFor example: \njava, spring, github \nIf you don't need tags, send - \nTo cancel, enter /cancel
link.accept.fail=The link is invalid. \nOnly GitHub repositories and StackOverflow questions are supported. \nTry again or enter /cancel

link.add.success=The link has been successfully added to tracking.
link.add.already-tracked=This link is already being followed
link.add.chat-not-registered=Chat not registered. Send /start first.
link.add.invalid-scrapper-request=The request was rejected as invalid. Please resend the link and tags or enter /cancel
link.add.scrapper-is-unavailable=Service is currently unavailable. Try again later.
link.add.client-error=Failed to add link

command.untrack.description=remove a tracked link
command.untrack.usage=Usage: /untrack <link>\n\nExample:\n/untrack https://github.com/user/repo
command.untrack.invalid-link=Invalid link.\nOnly GitHub repositories and StackOverflow questions are supported.
command.untrack.success=The link has been removed from tracking

command.list.description=show tracked links
command.list.header=Tracked links:
command.list.header.by-tag=Tracked links with tag "{0}":
command.list.empty=Your tracked links list is empty
command.list.empty.by-tag=No tracked links found for tag "{0}"
command.list.tags-label=Tags

command.exception.unknown=Something went wrong.Try again or later
command.exception.chat-not-registered=The chat is not registered. Send /start first
command.exception.invalid-request=The request was rejected as invalid
command.exception.scrapper-unavailable=Scrapper is currently unavailable. Please try again later
command.exception.scrapper-client-error=Something went wrong.Try again or later
command.exception.chart-already-registered=Chat is already registered
command.exception.link-not-found=The link not found
