server:
  port: 8080

spring:
  application:
    name: bot

  config:
    import: optional:file:bot/.env[.properties]


app:
  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    update-listener-sleep: 1s
    debug: false

  scrapper:
    base-url: http://localhost:8081


logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} level=%-5level logger=%logger{36} msg=\"%msg\" %kvp%n"

