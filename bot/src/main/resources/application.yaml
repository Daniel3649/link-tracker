server:
  port: 8080

spring:
  application:
    name: bot
  grpc:
    server:
      port: 9090
      servlet:
        enabled: false
    client:
      channels:
        scrapper:
          address: ${app.scrapper.grpc-address}

  config:
    import:
      - optional:file:.env.properties
      - optional:file:bot/.env.properties
      - optional:file:.env[.properties]
      - optional:file:bot/.env[.properties]


app:
  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    update-listener-sleep: 1s
    debug: false

  scrapper:
    transport: grpc
    base-url: http://localhost:8081
    grpc-address: localhost:9091


logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} level=%-5level logger=%logger{36} msg=\"%msg\" %kvp %mdc%n"
